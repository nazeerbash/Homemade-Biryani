<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="owner.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f6f0e8 0%, #efe6db 100%);
      color: #4f2f1d;
      font-family: "DM Sans", sans-serif;
    }
    .login-card {
      width: min(92vw, 420px);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(111, 74, 41, 0.12);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 18px 42px rgba(87, 58, 28, 0.12);
    }
    .eyebrow {
      margin: 0 0 0.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8f5a32;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-family: "Playfair Display", serif;
      font-size: clamp(2.2rem, 4vw, 3rem);
      line-height: 1.1;
      color: #3c2014;
    }
    form {
      display: grid;
      gap: 1rem;
      margin-top: 1.25rem;
    }
    label {
      display: grid;
      gap: 0.45rem;
      font-weight: 600;
      color: #4a2f22;
    }
    input {
      padding: 0.85rem 0.9rem;
      border-radius: 12px;
      border: 1px solid rgba(102, 70, 44, 0.18);
      background: #fffaf5;
      font: inherit;
      color: #2d1d14;
    }
    input:focus {
      outline: 2px solid rgba(150, 98, 42, 0.25);
      border-color: rgba(150, 98, 42, 0.5);
    }
    button {
      margin-top: 0.5rem;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #7b3f1d, #a35d2d);
      color: white;
      font-weight: 700;
      padding: 0.9rem 1.1rem;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(123, 63, 29, 0.25);
    }
    .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: #6b3d22;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="eyebrow">secure access</div>
    <h1>Owner dashboard</h1>
    <p>Enter your owner username and password to open the recipe dashboard.</p>

    <form action="/login" method="post" autocomplete="on">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Open dashboard</button>
    </form>

    <a class="back-link" href="/">← Back to the storefront</a>
  </main>
</body>
</html>
